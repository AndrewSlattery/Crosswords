<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crossword Solver — live</title>
<style>
  :root {
    --bg:#f4f5f7; --panel:#ffffff; --ink:#222; --muted:#6b7280; --line:#e2e4e8;
    --blocked:#2b2f36;
    --empty:#ffffff; --tentative:#e6f0ff; --corrob:#d6f0d8; --conflict:#fcdada;
    --inflight:#f5a623;
    --chip-unsolved:#eceef1; --chip-dispatched:#ffedcc; --chip-candidate:#ede7fb;
    --chip-committed:#dce9ff; --chip-conflict:#fcdada; --chip-verified:#d6f0d8;
    --chip-rejected:#f6cfcf;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { background:var(--panel); border-bottom:1px solid var(--line);
           padding:10px 16px; position:sticky; top:0; z-index:5; }
  .titlerow { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; font-weight:700; }
  .conn { font-size:12px; color:var(--muted); }
  .conn.live::before { content:"● "; color:#2faa4d; }
  .conn.dead::before { content:"● "; color:#cc3b3b; }
  .scoreboard { display:flex; gap:18px; flex-wrap:wrap; margin-top:6px; font-size:13px; }
  .scoreboard b { font-variant-numeric:tabular-nums; }
  .bar { height:7px; background:var(--line); border-radius:4px; margin-top:7px; overflow:hidden; }
  .bar > span { display:block; height:100%; background:linear-gradient(90deg,#5b8def,#2faa4d); width:0; transition:width .4s; }
  main { display:flex; gap:16px; padding:16px; align-items:flex-start; flex-wrap:wrap; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em;
              color:var(--muted); margin:0 0 10px; font-weight:700; }

  /* grid */
  #grid { display:grid; gap:2px; }
  .cell { width:30px; height:30px; position:relative; border-radius:3px;
          display:flex; align-items:center; justify-content:center;
          font-weight:700; font-size:16px; text-transform:uppercase; color:#1a1a1a;
          border:1px solid #d4d7dc; user-select:none; }
  .cell.blocked { background:var(--blocked); border-color:var(--blocked); }
  .cell.empty { background:var(--empty); }
  .cell.tentative { background:var(--tentative); }
  .cell.corroborated { background:var(--corrob); }
  .cell.conflict { background:var(--conflict); color:#a01818; }
  .cell.inflight { box-shadow:0 0 0 2px var(--inflight); animation:pulse 1.1s ease-in-out infinite; }
  .cell.hl { outline:3px solid #2f6fed; outline-offset:-3px; z-index:2; }
  .cell .num { position:absolute; top:1px; left:2px; font-size:8px; font-weight:600;
               color:var(--muted); line-height:1; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 2px var(--inflight);} 50%{box-shadow:0 0 0 4px rgba(245,166,35,.4);} }
  @keyframes flash { from{background:#fff7cc;} to{} }
  .cell.flash { animation:flash 1s ease-out; }
  .legend { margin-top:10px; font-size:11px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
  .legend i { display:inline-block; width:11px; height:11px; border-radius:2px;
              border:1px solid #ccc; vertical-align:-1px; margin-right:3px; }

  /* feed */
  .feedwrap { flex:1 1 320px; min-width:300px; max-width:520px; }
  #feed { max-height:520px; overflow:auto; font-size:12.5px; }
  .ev { padding:4px 2px; border-bottom:1px dashed var(--line); display:flex; gap:7px; }
  .ev time { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .ev .txt { flex:1; }
  .ev .eid { font-weight:700; }
  .ev.commit .txt { color:#15521f; }
  .ev.conflict .txt, .ev.bad .txt { color:#a01818; }
  .ev.retract .txt { color:#8a5a00; }

  /* clues */
  .clues { display:flex; gap:16px; padding:0 16px 24px; align-items:flex-start; flex-wrap:wrap; }
  .cluecol { flex:1 1 420px; min-width:340px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line);
           vertical-align:top; font-size:13px; }
  th { font-size:11px; text-transform:uppercase; color:var(--muted); }
  tr.clue { cursor:pointer; }
  tr.clue:hover { background:#f0f4ff; }
  tr.clue.pinned { background:#e4ecff; }
  .num-c { width:30px; color:var(--muted); font-weight:700; }
  .ans { font-weight:700; letter-spacing:.04em; }
  .pat { font-family:ui-monospace,Consolas,monospace; color:var(--muted); }
  .parse { font-family:ui-monospace,Consolas,monospace; font-size:11.5px; color:#444; }
  .chip { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px;
          font-weight:600; white-space:nowrap; }
  .chip.unsolved{background:var(--chip-unsolved);color:#666}
  .chip.dispatched{background:var(--chip-dispatched);color:#8a5a00}
  .chip.candidate{background:var(--chip-candidate);color:#5b3fbf}
  .chip.committed{background:var(--chip-committed);color:#1c4fa3}
  .chip.conflicted{background:var(--chip-conflict);color:#a01818}
  .chip.verified{background:var(--chip-verified);color:#15521f}
  .chip.rejected{background:var(--chip-rejected);color:#7a1414}
  .confbar { height:5px; width:46px; background:var(--line); border-radius:3px; display:inline-block; overflow:hidden; vertical-align:middle; }
  .confbar > span { display:block; height:100%; background:#5b8def; }
  .empty-note { color:var(--muted); padding:20px; }
</style>
</head>
<body>
<header>
  <div class="titlerow">
    <h1>Crossword Solver — live</h1>
    <span id="conn" class="conn">connecting…</span>
  </div>
  <div class="scoreboard" id="scoreboard"></div>
  <div class="bar"><span id="progress"></span></div>
</header>

<main>
  <div class="panel">
    <h2>Grid</h2>
    <div id="grid"></div>
    <div class="legend">
      <span><i style="background:var(--tentative)"></i>one crosser</span>
      <span><i style="background:var(--corrob)"></i>corroborated</span>
      <span><i style="background:var(--conflict)"></i>conflict</span>
      <span><i style="background:#fff;box-shadow:0 0 0 2px var(--inflight)"></i>being solved</span>
    </div>
  </div>
  <div class="panel feedwrap">
    <h2>Activity</h2>
    <div id="feed"></div>
  </div>
</main>

<div class="clues">
  <div class="panel cluecol"><h2>Across</h2><div id="across"></div></div>
  <div class="panel cluecol"><h2>Down</h2><div id="down"></div></div>
</div>

<script>
const POLL_MS = 1500;
let prevLetters = {};          // "r,c" -> letter, for flash-on-change
let pinned = null;             // pinned entry id
let cellEls = {};              // "r,c" -> DOM node (rebuilt each render)
let entryCells = {};           // entry id -> ["r,c", ...]

const key = (r, c) => r + "," + c;
const fmtTime = ts => new Date(ts * 1000).toLocaleTimeString();
const conf = x => (x == null ? "" : x.toFixed(2));

async function poll() {
  try {
    const [v, e] = await Promise.all([
      fetch("/view").then(r => r.json()),
      fetch("/events").then(r => r.json()),
    ]);
    setConn(true);
    if (v && !v.error) render(v);
    renderFeed(e || []);
  } catch (err) {
    setConn(false);
  }
}

function setConn(live) {
  const c = document.getElementById("conn");
  c.className = "conn " + (live ? "live" : "dead");
  c.textContent = live ? "live · updated " + new Date().toLocaleTimeString()
                       : "disconnected — is `xw.py serve` running?";
}

function render(v) {
  renderScore(v.stats);
  renderGrid(v);
  renderClues(v);
}

function renderScore(s) {
  if (!s) return;
  const en = s.entries, ce = s.cells;
  document.getElementById("scoreboard").innerHTML =
    `<span>solved <b>${en.solved}/${en.total}</b> (${en.pct_solved}%)</span>` +
    `<span>cells <b>${ce.pct_filled}%</b></span>` +
    `<span>corroborated <b>${ce.corroborated}/${ce.total}</b></span>` +
    `<span>verified <b>${en.verified}</b></span>` +
    `<span style="color:${s.conflicts ? '#a01818' : 'inherit'}">conflicts <b>${s.conflicts}</b></span>`;
  document.getElementById("progress").style.width = en.pct_solved + "%";
}

function renderGrid(v) {
  const g = document.getElementById("grid");
  g.style.gridTemplateColumns = `repeat(${v.cols}, 30px)`;

  // index light cells + in-flight cells + start numbers
  const light = {}, inflight = new Set(), nums = {};
  for (const c of v.cells) light[key(c.r, c.c)] = c;
  entryCells = {};
  for (const e of v.entries) {
    entryCells[e.id] = e.cells.map(([r, c]) => key(r, c));
    if (e.start) nums[key(e.start[0], e.start[1])] = e.number;
    if (e.status === "dispatched")
      for (const [r, c] of e.cells) inflight.add(key(r, c));
  }

  const frag = document.createDocumentFragment();
  const newLetters = {};
  cellEls = {};
  for (let r = 0; r < v.rows; r++) {
    for (let c = 0; c < v.cols; c++) {
      const k = key(r, c), cell = light[k];
      const d = document.createElement("div");
      d.className = "cell " + (cell ? cell.state : "blocked");
      if (cell) {
        if (inflight.has(k)) d.classList.add("inflight");
        if (nums[k] != null) {
          const n = document.createElement("span");
          n.className = "num"; n.textContent = nums[k]; d.appendChild(n);
        }
        if (cell.letter) {
          d.appendChild(document.createTextNode(cell.letter));
          newLetters[k] = cell.letter;
          if (prevLetters[k] !== cell.letter && Object.keys(prevLetters).length)
            d.classList.add("flash");
        }
        cellEls[k] = d;
      }
      frag.appendChild(d);
    }
  }
  g.replaceChildren(frag);
  prevLetters = newLetters;
  if (pinned) highlight(pinned, true);
}

function highlight(eid, on) {
  for (const k of (entryCells[eid] || []))
    if (cellEls[k]) cellEls[k].classList.toggle("hl", on);
}

function renderClues(v) {
  const across = v.entries.filter(e => e.direction === "across");
  const down = v.entries.filter(e => e.direction === "down");
  document.getElementById("across").innerHTML = clueTable(across);
  document.getElementById("down").innerHTML = clueTable(down);
  for (const tr of document.querySelectorAll("tr.clue")) {
    const eid = tr.dataset.eid;
    tr.onmouseenter = () => { if (!pinned) highlight(eid, true); };
    tr.onmouseleave = () => { if (!pinned) highlight(eid, false); };
    tr.onclick = () => {
      if (pinned) highlight(pinned, false);
      pinned = (pinned === eid) ? null : eid;
      document.querySelectorAll("tr.clue").forEach(x =>
        x.classList.toggle("pinned", x.dataset.eid === pinned));
      if (pinned) highlight(pinned, true);
    };
  }
}

function clueTable(list) {
  if (!list.length) return '<p class="empty-note">none</p>';
  let h = "<table><tr><th>#</th><th>Clue</th><th>Status</th><th>Answer / parse</th></tr>";
  for (const e of list) {
    const ans = e.committed
      ? `<div class="ans">${e.committed}</div>` +
        (e.confidence != null ? `<span class="confbar"><span style="width:${Math.round(e.confidence*100)}%"></span></span> ${conf(e.confidence)}` : "") +
        (e.parse ? `<div class="parse">${escapeHtml(e.parse)}</div>` : "")
      : `<span class="pat">${e.pattern || "?".repeat(e.length)}</span>`;
    const model = (e.claim && e.claim.model) ? " " + e.claim.model : "";
    h += `<tr class="clue" data-eid="${e.id}">` +
      `<td class="num-c">${e.number}${e.direction[0].toUpperCase()}</td>` +
      `<td>${escapeHtml(e.clue)}</td>` +
      `<td><span class="chip ${e.status}">${statusLabel(e.status)}${model}</span></td>` +
      `<td>${ans}</td></tr>`;
  }
  return h + "</table>";
}

function statusLabel(s) {
  return ({unsolved:"·", dispatched:"⏳ solving", candidate:"◌ candidate",
           committed:"✓ in grid", conflicted:"⚠ conflict", verified:"✅ verified",
           rejected:"✗ rejected"})[s] || s;
}

function renderFeed(events) {
  const f = document.getElementById("feed");
  if (!events.length) { f.innerHTML = '<p class="empty-note">no activity yet</p>'; return; }
  f.innerHTML = events.map(ev => {
    const cls = ev.conflict_cells ? "conflict"
      : (ev.type === "verify" && ev.value === false) ? "bad" : ev.type;
    return `<div class="ev ${cls}"><time>${fmtTime(ev.ts)}</time>` +
           `<span class="txt">${evText(ev)}</span></div>`;
  }).join("");
}

function evText(ev) {
  const id = ev.entry ? `<span class="eid">${ev.entry}</span>` : "";
  switch (ev.type) {
    case "init": return `🧩 puzzle loaded — ${ev.entries} clues, ${ev.rows}×${ev.cols}`;
    case "claim": return `⏳ ${id} → ${ev.role || "solver"}${ev.model ? " ("+ev.model+")" : ""} dispatched`;
    case "release": return `↩ ${id} released`;
    case "candidate": return `◌ ${id} candidate ${ev.answer} @${conf(ev.confidence)}`;
    case "commit": {
      let t = `✓ ${id} = ${ev.answer} @${conf(ev.confidence)}`;
      if (ev.corroborated != null) t += ` · ${ev.corroborated}/${ev.total_cells} corroborated`;
      if (ev.conflict_cells) t += ` · ⚠ created a conflict`;
      return t;
    }
    case "retract": return `🗑 ${id} retracted` + (ev.conflict_cells ? " (conflict remains)" : "");
    case "verify": return `${ev.value ? "✅" : "✗"} ${id} parse ${ev.value ? "verified" : "rejected"}`;
    case "parse": return `✎ ${id} parse updated`;
    default: return `${ev.type} ${id}`;
  }
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
}

poll();
setInterval(poll, POLL_MS);
</script>
</body>
</html>
